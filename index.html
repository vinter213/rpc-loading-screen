
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPC Loading</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #100914;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

#background {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: #100914;
  background-image: url("https://rpc-loading-screen.onrender.com/FonRP.png");
  background-repeat: no-repeat;
  background-position: center center;
  background-size: cover;
  pointer-events: none;
}

/* Затемнение для читаемости текста */
#background::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      rgba(8, 5, 13, .65),
      rgba(8, 5, 13, .12),
      rgba(8, 5, 13, .35)
    ),
    linear-gradient(
      0deg,
      rgba(8, 5, 13, .60),
      transparent 55%,
      rgba(8, 5, 13, .18)
    );
}

#rpc {
  position: absolute;
  z-index: 10;
  left: 15%;
  top: 8%;
  width: 70%;
  height: 82%;
  padding: 2% 3%;
  text-align: center;
  background: transparent;
  pointer-events: none;
}

#logo {
  display: block;
  width: 360px;
  max-width: 70%;
  max-height: 160px;
  height: auto;
  object-fit: contain;
  object-position: center;
  margin: 0 auto;
}

h1 {
  margin: 12px 0 5px;
  font-size: 40px;
  letter-spacing: 4px;
  text-align: center;
  text-shadow: 0 2px 15px #000;
}

#subtitle {
  color: #ff789f;
  letter-spacing: 3px;
  font-size: 14px;
  text-align: center;
  text-shadow: 0 2px 10px #000;
}

#server_info {
  position: relative;
  width: 80%;
  max-width: 650px;
  margin: 25px auto 0;
  padding: 14px 18px;
  background: rgba(12, 6, 20, .48);
  white-space: normal;
  text-align: center;
  text-shadow: 0 2px 8px #000;
}

#serverName {
  font-size: 22px;
  font-weight: bold;
}

#serverMap,
#serverGamemode,
#status {
  margin-top: 8px;
  font-size: 15px;
  color: #e0c9e5;
  overflow-wrap: anywhere;
}

/* Нижняя панель музыки */
#bottom {
  position: fixed;
  z-index: 99999;
  left: 0;
  right: 0;
  bottom: 3%;
  width: 100%;
  padding: 12px 10px;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  background: transparent;
  pointer-events: auto;
}

button {
  padding: 10px 18px;
  margin: 5px;
  background: rgba(111, 22, 79, .92);
  color: #fff;
  border: 1px solid #f05b9c;
  font-size: 15px;
  cursor: pointer;
  pointer-events: auto;
}

button:hover {
  background: #8b2164;
}

#bottom label {
  color: #fff;
  font-size: 14px;
  pointer-events: auto;
}

#volume {
  display: inline-block;
  width: 150px;
  max-width: 30vw;
  height: 18px;
  vertical-align: middle;
  cursor: pointer;
  accent-color: #fa477f;
  pointer-events: auto;
}

#musicState {
  display: inline-block;
  margin: 5px 12px;
  color: #f3d9ef;
  font-size: 13px;
  pointer-events: none;
}

@media (max-width: 700px) {
  #rpc {
    left: 4%;
    top: 7%;
    width: 92%;
    height: 80%;
    padding: 2%;
  }

  #logo {
    max-height: 110px;
  }

  h1 {
    font-size: 30px;
  }

  #subtitle {
    font-size: 11px;
    letter-spacing: 2px;
  }

  #server_info {
    width: 95%;
    margin-top: 18px;
    padding: 12px;
  }

  #serverName {
    font-size: 18px;
  }

  #bottom {
    bottom: 1%;
  }
}
</style>
</head>

<body>

<div id="background"></div>

<main id="rpc">
  <img
    id="logo"
    src="https://rpc-loading-screen.onrender.com/Logo_RPC.png"
    alt="RPC"
  >

  <h1>RPC</h1>

  <div id="subtitle">
    RUSSIAN MEDIUM ROLEPLAY
  </div>

  <section id="server_info">
    <div id="serverName">RPC | Russian Medium RP</div>
    <div id="serverMap">Карта загружается...</div>
    <div id="serverGamemode">Режим: DarkRP</div>
    <div id="status">Подготовка к подключению...</div>
  </section>
</main>

<div id="bottom">
  <button id="musicButton" type="button">
    ▶ Включить музыку
  </button>

  <label for="volume">Громкость:</label>

  <input
    id="volume"
    type="range"
    min="0"
    max="100"
    value="40"
  >

  <span id="musicState">Музыка выключена</span>
</div>

<audio
  id="rpcTrack"
  src="https://rpc-loading-screen.onrender.com/rpc_music.mp3"
  preload="auto"
  loop>
</audio>

<script>
(function () {
  "use strict";

  var track = document.getElementById("rpcTrack");
  var button = document.getElementById("musicButton");
  var volume = document.getElementById("volume");
  var state = document.getElementById("musicState");

  if (!track || !button || !volume || !state) {
    return;
  }

  track.volume = Number(volume.value) / 100;

  function updateVolume() {
    track.volume = Number(volume.value) / 100;
  }

  function playTrack() {
    var result = track.play();

    if (result && typeof result.then === "function") {
      result.then(function () {
        button.textContent = "⏸ Пауза";
        state.textContent = "Музыка играет";
      }).catch(function () {
        button.textContent = "▶ Включить музыку";
        state.textContent = "Нажми кнопку для запуска музыки";
      });
    } else {
      button.textContent = "⏸ Пауза";
      state.textContent = "Попытка запуска музыки";
    }
  }

  button.addEventListener("click", function () {
    if (track.paused) {
      playTrack();
    } else {
      track.pause();
      button.textContent = "▶ Продолжить";
      state.textContent = "Музыка на паузе";
    }
  });

  volume.addEventListener("input", updateVolume);
  volume.addEventListener("change", updateVolume);

  track.addEventListener("ended", function () {
    button.textContent = "▶ Включить музыку";
    state.textContent = "Музыка закончилась";
  });

  track.addEventListener("error", function () {
    state.textContent = "Не удалось загрузить музыку";
  });

  window.GameDetails = function (
    servername,
    serverurl,
    mapname,
    maxplayers,
    steamid,
    gamemode,
    gamevolume,
    lang,
    gamemodeNice
  ) {
    document.getElementById("serverName").textContent =
      servername || "RPC | Russian Medium RP";

    document.getElementById("serverMap").textContent =
      "Карта: " + (mapname || "неизвестна");

    document.getElementById("serverGamemode").textContent =
      "Режим: " + (gamemodeNice || gamemode || "DarkRP");

    document.getElementById("status").textContent =
      "Подключение к серверу...";
  };

  window.DownloadingFile = function (file) {
    document.getElementById("status").textContent =
      "Загрузка: " + (file || "файла");
  };

  window.SetStatusChanged = function (statusText) {
    document.getElementById("status").textContent =
      statusText || "Загрузка ресурсов...";
  };

  window.SetFilesTotal = function (needed, total) {
    document.getElementById("status").textContent =
      "Загрузка файлов: " + (needed || 0) + " / " + (total || 0);
  };

  window.SetFilesNeeded = function (needed) {
    document.getElementById("status").textContent =
      "Осталось загрузить файлов: " + (needed || 0);
  };

  // Не запускаем музыку автоматически:
  // Chromium в Garry's Mod может блокировать автозапуск.
})();
</script>

</body>
</html>
